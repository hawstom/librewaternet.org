# https://librewaternet.local — same document root, cert signed by the existing HawsEDC Local Dev CA
# (~/.local/share/hawsedc-certs/hawsedc-local-ca.crt), so the browser that already trusts
# hawsedc.local trusts this with no new trust decision.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName librewaternet.local
    DocumentRoot /home/haws/webdev/librewaternet.org
    <Directory /home/haws/webdev/librewaternet.org>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /engcalcs /home/haws/webdev/hawsedc.subset/engcalcs
    <Directory /home/haws/webdev/hawsedc.subset/engcalcs>
        AllowOverride All
        Require all granted
    </Directory>

    SetEnv APP_ENV development
    SSLEngine on
    SSLCertificateFile    /home/haws/.local/share/hawsedc-certs/librewaternet.local.crt
    SSLCertificateKeyFile /home/haws/.local/share/hawsedc-certs/librewaternet.local.key
    ErrorLog  ${APACHE_LOG_DIR}/librewaternet-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/librewaternet-ssl-access.log combined
</VirtualHost>
</IfModule>
