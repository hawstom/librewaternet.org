# librewaternet.local — the landing site, served the way the real host will serve it.
#
# DocumentRoot is the librewaternet.org repository. The Alias below is the LOCAL stand-in for the
# symlink planned on the real host (ROADMAP Task 479): librewaternet.org/engcalcs serves the same
# checkout hawsedc.com/engcalcs does, so the suite is reachable under this domain too. An Alias is
# used rather than a symlink because it needs no Options +FollowSymLinks.
<VirtualHost *:80>
    ServerName librewaternet.local
    DocumentRoot /home/haws/webdev/librewaternet.org
    <Directory /home/haws/webdev/librewaternet.org>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /engcalcs /home/haws/webdev/hawsedc.subset/engcalcs
    <Directory /home/haws/webdev/hawsedc.subset/engcalcs>
        AllowOverride All
        Require all granted
    </Directory>

    SetEnv APP_ENV development
    ErrorLog ${APACHE_LOG_DIR}/librewaternet-error.log
    CustomLog ${APACHE_LOG_DIR}/librewaternet-access.log combined
</VirtualHost>
